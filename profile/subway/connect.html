<!doctype html><meta charset="utf8"><link rel="stylesheet" href="sign.css">
<style>
#stage{height:316px}
h1{position:absolute;left:108px;top:50px;margin:0;font-size:118px;font-weight:800;letter-spacing:-.025em;line-height:1}
p{position:absolute;left:112px;top:180px;width:1030px;margin:0;font-size:37px;line-height:1.3;font-weight:500}
</style>
<div id="stage">
 <h1>last stop</h1>
 <p>want to build something together? internships, projects, collabs. transfer here.</p>
 <svg id="s" width="1200" height="316" viewBox="0 0 1200 316"></svg>
</div>
<script src="colors.js"></script><script src="lib.js"></script>
<script>
// the closing sign: the page's route comes straight down from the sections above and ends at a bumper.
// the words sit beside the line; the transfer row (xfer-*.png) goes directly under this in the README.
const svg = document.getElementById('s'), X = ROUTE.full, END = 262;
el('line', { x1: X, x2: X, y1: -10, y2: END, stroke: WHITE, 'stroke-width': 15 }, svg);
el('line', { x1: X - 26, x2: X + 26, y1: END + 2, y2: END + 2, stroke: WHITE, 'stroke-width': 9 }, svg);          // the bumper
const dot = el('circle', { cx: X, cy: END - 30, r: 4.8, fill: INK }, svg);
const train = el('line', { x1: X, x2: X, stroke: INK, 'stroke-width': 7, 'stroke-linecap': 'round' }, svg);
const T = 6000, STOP = END - 42, LEN = 60;
window.__seek = ms => { const t = ((ms % T) + T) % T;
  // parked on frame 0; it clears, then the next train comes down the line and brakes to the same spot
  let head = STOP, op = 1;
  if (t >= 1300 && t < 1800) op = 1 - cl((t - 1300) / 350);
  if (t >= 1800) { const k = cl((t - 1800) / 2600); head = -30 + (STOP + 30) * (1 - Math.pow(1 - k, 3)); op = 1; }
  train.setAttribute('y1', Math.max(-20, head - LEN)); train.setAttribute('y2', head); train.style.opacity = op;
  const arr = t >= 4400 ? oq(1 - cl((t - 4400) / 600)) : 0; dot.setAttribute('r', 4.8 * (1 + .8 * arr));
};
window.__seek(0);
</script>
